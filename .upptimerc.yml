# Upptime (https://upptime.js.org) configuration for the Arbium status page
owner: try-caret
repo: status

sites:
  - name: Website
    url: https://arbium.ai
  - name: API
    url: https://api.arbium.ai/api/health
  - name: Documentation
    url: https://docs.arbium.ai

status-website:
  # Once the Cloudflare CNAME for status.arbium.ai exists, uncomment `cname`
  # and remove `baseUrl` (baseUrl is only needed while serving from the
  # github.io subpath).
  # cname: status.arbium.ai
  baseUrl: /status
  name: Arbium Status
  introTitle: "**Arbium** service status"
  introMessage: Live uptime and incident history for Arbium services, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://arbium.ai
