# Upptime (https://upptime.js.org) configuration for the Arbium status page
owner: try-caret
repo: status

sites:
  - name: Website
    url: https://arbium.ai
  - name: API
    url: https://api.arbium.ai/api/health
  - name: Documentation
    url: https://docs.arbium.ai

status-website:
  # The public URL is https://status.arbium.ai, served by the Cloudflare
  # Worker in worker/ which proxies every path onto the /status subpath of
  # try-caret.github.io. So the site is built for the domain root: no
  # `baseUrl` here, and no `cname` (a GitHub Pages custom domain would 301
  # github.io requests back to status.arbium.ai and loop the proxy).
  name: Arbium Status
  introTitle: "**Arbium** service status"
  introMessage: Live uptime and incident history for Arbium services, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://arbium.ai
